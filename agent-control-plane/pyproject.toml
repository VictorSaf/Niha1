[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Reusable local-first agent control plane powered by Ollama."
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "pyyaml==6.0.2",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
